name: StripBot Cloud MCP checks
on:
  push:
    paths:
      - 'modules/integrations/mcp/**'
      - 'backend/gateway.cjs'
      - 'test/mcp-cloud-*.test.js'
      - 'test/integrations.test.js'
      - 'codex-ui/src/components/Sidebar/IntegrationsTool.tsx'
      - 'codex-ui/src/components/Sidebar/integrations-tool.css'
      - 'codex-ui/src/components/Sidebar/BuiltinPluginsTool.tsx'
      - 'codex-ui/src/components/Sidebar/MarketplaceTool.tsx'
      - 'codex-ui/src/components/Sidebar/ToolsHub.tsx'
      - 'codex-ui/src/components/Sidebar/ToolWorkspace.tsx'
      - 'codex-ui/src/components/Sidebar/ChatHistory.tsx'
      - 'codex-ui/src/components/Sidebar/chat-history.css'
      - 'codex-ui/src/components/Sidebar/GithubToolsTool.tsx'
      - 'codex-ui/src/styles/left-tool-workspace.css'
      - 'test/ui-simplification.test.js'
      - 'codex-ui/src/App.tsx'
      - 'codex-ui/src/components/ui/StripButton.tsx'
      - 'codex-ui/src/components/ui/StripIconButton.tsx'
      - 'codex-ui/src/components/Activity/UnifiedConversationStream.tsx'
      - 'codex-ui/src/components/Activity/SessionApproval.tsx'
      - 'codex-ui/src/components/Sidebar/tools-hub.css'
      - 'codex-ui/src/vendor/codex-ui-kit/**'
      - 'codex-ui/src/modules/theme/**'
      - 'codex-ui/src/components/Sidebar/ApiAccountMenu.tsx'
      - 'codex-ui/src/styles/account-popover.css'
      - 'codex-ui/public/avatars/**'
      - 'test/api-avatar-dicebear.test.js'
      - 'codex-ui/src/vendor/liquid-glass-react/**'
      - 'test/liquid-glass-theme.test.js'
      - 'codex-ui/src/components/ConnectionSettings.tsx'
      - 'test/theme-background-presets.test.js'
      - 'codex-ui/src/components/Sidebar/marketplace-tool.css'
      - '.github/workflows/stripbot-cloud-mcp.yml'
  pull_request:
    paths:
      - 'modules/integrations/mcp/**'
      - 'backend/gateway.cjs'
      - 'test/mcp-cloud-*.test.js'
      - 'test/integrations.test.js'
      - 'codex-ui/src/components/Sidebar/IntegrationsTool.tsx'
      - 'codex-ui/src/components/Sidebar/integrations-tool.css'
      - 'codex-ui/src/components/Sidebar/BuiltinPluginsTool.tsx'
      - 'codex-ui/src/components/Sidebar/MarketplaceTool.tsx'
      - 'codex-ui/src/components/Sidebar/ToolsHub.tsx'
      - 'codex-ui/src/components/Sidebar/ToolWorkspace.tsx'
      - 'codex-ui/src/components/Sidebar/ChatHistory.tsx'
      - 'codex-ui/src/components/Sidebar/chat-history.css'
      - 'codex-ui/src/components/Sidebar/GithubToolsTool.tsx'
      - 'codex-ui/src/styles/left-tool-workspace.css'
      - 'test/ui-simplification.test.js'
      - 'codex-ui/src/App.tsx'
      - 'codex-ui/src/components/ui/StripButton.tsx'
      - 'codex-ui/src/components/ui/StripIconButton.tsx'
      - 'codex-ui/src/components/Activity/UnifiedConversationStream.tsx'
      - 'codex-ui/src/components/Activity/SessionApproval.tsx'
      - 'codex-ui/src/components/Sidebar/tools-hub.css'
      - 'codex-ui/src/vendor/codex-ui-kit/**'
      - 'codex-ui/src/modules/theme/**'
      - 'codex-ui/src/components/Sidebar/ApiAccountMenu.tsx'
      - 'codex-ui/src/styles/account-popover.css'
      - 'codex-ui/public/avatars/**'
      - 'test/api-avatar-dicebear.test.js'
      - 'codex-ui/src/vendor/liquid-glass-react/**'
      - 'test/liquid-glass-theme.test.js'
      - 'codex-ui/src/components/ConnectionSettings.tsx'
      - 'test/theme-background-presets.test.js'
      - 'codex-ui/src/components/Sidebar/marketplace-tool.css'
  workflow_dispatch:
jobs:
  cloud-mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test cloud MCP server and client
        run: node --test test/mcp-cloud-server.test.js test/mcp-cloud-connector.test.js test/integrations.test.js test/theme-background-presets.test.js test/liquid-glass-theme.test.js test/api-avatar-dicebear.test.js test/ui-simplification.test.js
  cloud-ui-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codex-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: codex-ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build UI
        run: npm run build
      - name: Upload UI bundle
        uses: actions/upload-artifact@v4
        with:
          name: stripbot-cloud-ui
          path: codex-ui/dist
          if-no-files-found: error
