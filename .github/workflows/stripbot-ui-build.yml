name: StripBot UI Build

on:
  push:
    branches: [main]
    paths:
      - 'codex-ui/**'
      - 'modules/agent/ui-generation/**'
      - '.github/workflows/stripbot-ui-build.yml'
  pull_request:
    paths:
      - 'codex-ui/**'
      - 'modules/agent/ui-generation/**'
      - '.github/workflows/stripbot-ui-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stripbot-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: codex-ui
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: codex-ui/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript type check
        run: npm run typecheck
      - name: Vite production build
        run: npm run build
      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stripbot-ui-dist
          path: codex-ui/dist/
          if-no-files-found: error
          retention-days: 7
