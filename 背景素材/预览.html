<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>背景素材 - 本地样式预览</title>
<link rel="stylesheet" href="./04-独立CSS样式/背景合集.css">
<style>
body{margin:0;background:#f6f8fc;color:#24354e;font-family:system-ui,"Microsoft YaHei",sans-serif}
header{background:linear-gradient(130deg,#dcedfb,#f1eafa);padding:42px max(24px,calc((100vw - 1050px)/2))}
h1{margin:0 0 7px;font-size:32px}p{margin:0;opacity:.75}main{max-width:1100px;margin:22px auto;padding:0 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:20px}
.card{min-width:0}.card h2{font-size:16px;margin:10px 0;color:#46556c;font-weight:550}
small{display:block;margin:4px 0 0;color:#7d8a9a}.sbg-demo{min-height:220px}
footer{padding:10px 0 40px;text-align:center;color:#718096;font-size:13px}
</style></head>
<body><header><h1>背景素材</h1><p>独立保存的毛玻璃、液态玻璃、极光和其他 UI 背景样式 · HTML/CSS 本地预览</p></header>
<main><div class="grid">
<div class="card"><div class="sbg-demo sbg-glass"><div class="sbg-panel">经典毛玻璃</div></div><h2>经典毛玻璃</h2><small>.sbg-glass</small></div>
<div class="card"><div class="sbg-demo sbg-liquid"><div class="sbg-panel">液态玻璃</div></div><h2>液态玻璃</h2><small>.sbg-liquid</small></div>
<div class="card"><div class="sbg-demo sbg-acrylic"><div class="sbg-panel">亚克力磨砂</div></div><h2>亚克力磨砂</h2><small>.sbg-acrylic</small></div>
<div class="card"><div class="sbg-demo sbg-mica"><div class="sbg-panel">云母材质</div></div><h2>云母材质</h2><small>.sbg-mica</small></div>
<div class="card"><div class="sbg-demo sbg-aurora"><div class="sbg-panel">极光渐变</div></div><h2>极光渐变</h2><small>.sbg-aurora</small></div>
<div class="card"><div class="sbg-demo sbg-neumorphic"><div class="sbg-panel">新拟物化</div></div><h2>新拟物化</h2><small>.sbg-neumorphic</small></div>
<div class="card"><div class="sbg-demo sbg-grid"><div class="sbg-panel">细线网格</div></div><h2>细线网格</h2><small>.sbg-grid</small></div>
<div class="card"><div class="sbg-demo sbg-night"><div class="sbg-panel">夜间星空</div></div><h2>夜间星空</h2><small>.sbg-night</small></div>
</div></main><footer>演示样式为独立编写；第三方开源库的原始快照存放在各分类文件夹。</footer></body></html>
